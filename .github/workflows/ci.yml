name: CI

on:
  push:
    branches: ["**"]  # every branch is tested; only main deploys (Render autoDeploy)
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Import accuracy
        run: python -m resume_engine.evals.import_report

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Types drift + tsc + vitest
        run: npm run check

  render-smoke:
    # The exact build and start commands from render.yaml, then real HTTP checks against the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (as on Render)
        run: cd web && npm ci && npm run build && cd .. && pip install ./engine
      - name: Start (as on Render) and check
        env:
          RESUME_ENGINE_WEB_DIST: web/dist
          RESUME_ENGINE_LLM: "off"
        run: |
          set -euo pipefail
          uvicorn resume_engine.api.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
          body() { curl -sf "http://127.0.0.1:8000$1" -o /tmp/body; }
          head_of() { curl -sf "http://127.0.0.1:8000$1" -D /tmp/head -o /dev/null; }
          echo "--- app pages (client-side routes get index.html)"
          for p in / /import /resumes/abc /tailor/xyz; do body "$p"; grep -q 'id="root"' /tmp/body; done
          echo "--- assets and content types"
          js=$(grep -o 'assets/index-[^"]*\.js' web/dist/index.html | head -1)
          head_of "/$js"; grep -qi '^content-type: text/javascript' /tmp/head
          worker=$(ls web/dist/assets | grep 'pdf.worker' | head -1)
          head_of "/assets/$worker"; grep -qi '^content-type: text/javascript' /tmp/head
          head_of /fonts/Carlito-Regular.ttf; grep -qi '^content-type: font/ttf' /tmp/head
          css=$(ls web/dist/assets/index-*.css | head -1)
          test "$(wc -c < "$css")" -gt 30000
          echo "--- API through the same server"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nope)" = "404"
          curl -sf -F "file=@fixtures/rendered/02_senior_software_engineer.classic.pdf"             http://127.0.0.1:8000/api/import/file -o /tmp/import.json
          grep -q 'Marcus Bennett' /tmp/import.json
          echo "all smoke checks passed"
      - if: failure()
        run: cat server.log || true
